name: Public product website
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: courtvision-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_release.py --history
      - run: pip install -r requirements-evaluation.txt
      - run: python -m unittest discover -s tests/public -v
      - run: python -m pytest v2/pregame_system/test_editorial_titles.py v2/pregame_system/test_publication_timing.py v2/frontend/test_publication_queue.py -q
      - run: python -m pytest v2/pregame_system/test_editorial_contract.py -k "market_spread_in_neighboring_clause or position_and_scoring_option_counts or real_stat_values_remain_factual" -q
      - run: python -m pytest v2/pregame_system/test_final_information.py v2/pregame_system/test_availability_display_identity.py v2/postgame_system/test_editorial_style.py v2/postgame_system/test_writer_retry.py -q
      - run: python -m pytest v2/postgame_system/test_article_contract.py v2/postgame_system/test_hupu_postgame.py v2/postgame_system/test_player_focus.py -q
      - run: python -m pytest evaluation/candidate_v4/test_contracts_v4.py evaluation/candidate_v2/test_contracts.py -k "not baseline" -q
      - run: node --check web/static-data.js
      - run: python scripts/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
